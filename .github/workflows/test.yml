name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11', '3.12']

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov pytest-xdist

    # Cross-platform FFmpeg install with caching. Much faster than
    # `choco install ffmpeg` on Windows (the previous bottleneck, ~2-3 min).
    - name: Install FFmpeg
      uses: federicocarboni/setup-ffmpeg@v3

    - name: Run test suite
      run: |
        pytest test_download_memories.py -v --tb=short

    - name: Run tests with coverage
      run: |
        pytest test_download_memories.py --cov=download_memories --cov-report=term --cov-report=html

    - name: Upload coverage report
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: coverage-report-${{ matrix.os }}-py${{ matrix.python-version }}
        path: htmlcov/
