name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

# Supersede in-flight runs on PR branches: rapid-fire pushes used to stack up
# whole matrices that then starved each other of runners. Runs on main are left
# alone so every merged commit keeps a result.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Single place to bump the tested interpreter. README documents 3.11+ as the
  # supported floor; CI tracks the latest stable.
  PYTHON_VERSION: '3.14'
  # Bump this date to pick up a newer FFmpeg on Windows. The cache is keyed on
  # it, so a stale key is what keeps the ~120 MB download from repeating.
  FFMPEG_WIN_CACHE_KEY: ffmpeg-win64-gpl-2026-08-06
  FFMPEG_WIN_URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      # Only two jobs now, but still report both platforms rather than hiding
      # the second failure behind the first.
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        # Cache the pip download/wheel cache so dependency installs don't
        # redownload every run. Keyed on the committed requirements.txt.
        cache: 'pip'
        cache-dependency-path: requirements.txt

    - name: Install dependencies
      # bash so the same step works on windows-latest.
      shell: bash
      run: |
        python -m pip install --upgrade pip
        # PyQt6 is GUI-only (snapchat_memories_gui.py). download_memories.py
        # never imports it and neither does the test suite, so skip the ~80 MB
        # wheel. Filtering here keeps requirements.txt the single source of
        # truth for users instead of forking a second dependency list.
        grep -v '^PyQt6' requirements.txt > requirements-ci.txt
        pip install -r requirements-ci.txt
        pip install pytest pytest-cov pytest-xdist

    - name: Install FFmpeg (macOS)
      if: runner.os == 'macOS'
      env:
        # `brew update` is the slow part of this step, not the install itself.
        HOMEBREW_NO_AUTO_UPDATE: 1
        HOMEBREW_NO_INSTALL_CLEANUP: 1
        HOMEBREW_NO_ENV_HINTS: 1
      run: brew install --quiet ffmpeg

    # Windows: `choco install ffmpeg` was the slow step (~2-3 min), and the
    # unmaintained setup-ffmpeg action flaked with "fetch failed". Download a
    # prebuilt static build, then cache it so steady-state runs skip the
    # ~120 MB transfer entirely.
    - name: Cache FFmpeg (Windows)
      if: runner.os == 'Windows'
      id: cache-ffmpeg
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}\ffmpeg
        key: ${{ env.FFMPEG_WIN_CACHE_KEY }}

    - name: Install FFmpeg (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      timeout-minutes: 8
      run: |
        $ErrorActionPreference = 'Stop'
        $dst = "$env:RUNNER_TEMP\ffmpeg"

        if ('${{ steps.cache-ffmpeg.outputs.cache-hit }}' -ne 'true') {
          $zip = "$env:RUNNER_TEMP\ffmpeg.zip"
          for ($i = 1; $i -le 4; $i++) {
            try { Invoke-WebRequest -Uri '${{ env.FFMPEG_WIN_URL }}' -OutFile $zip -UseBasicParsing -TimeoutSec 120; break }
            catch { if ($i -eq 4) { throw }; Write-Host "Download failed (attempt $i), retrying..."; Start-Sleep -Seconds 5 }
          }
          Expand-Archive -Path $zip -DestinationPath $dst -Force
          Remove-Item $zip -Force
        } else {
          Write-Host "Restored FFmpeg from cache."
        }

        $bin = (Get-ChildItem -Path $dst -Recurse -Filter ffmpeg.exe | Select-Object -First 1).DirectoryName
        if (-not $bin) { throw "ffmpeg.exe not found in $dst" }
        "$bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
        & "$bin\ffmpeg.exe" -version | Select-Object -First 1
        & "$bin\ffprobe.exe" -version | Select-Object -First 1

    # One invocation, parallelised. This used to be two steps that each ran the
    # full suite - once plain, once under coverage.
    - name: Run test suite
      run: pytest test_download_memories.py -n auto --tb=short --cov=download_memories --cov-report=term --cov-report=html

    # One artifact per run, not one per job, and expiring - these count against
    # the account's Actions storage allowance.
    - name: Upload coverage report
      if: success() && runner.os == 'Windows'
      uses: actions/upload-artifact@v7
      with:
        name: coverage-report
        path: htmlcov/
        retention-days: 7
